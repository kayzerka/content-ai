<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM · Instagram Direct</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182033;background:#f5f6fa}
body{margin:0;padding:28px}main{max-width:690px;margin:auto;background:white;border-radius:16px;padding:28px;box-shadow:0 8px 35px #18203312}
h1{font-size:24px;margin:0 0 6px}.sub{color:#65718a;margin-bottom:24px}label{display:block;font-weight:650;margin:16px 0 6px}
input,textarea{box-sizing:border-box;width:100%;font:inherit;border:1px solid #cbd2de;border-radius:9px;padding:12px}
textarea{min-height:140px;resize:vertical}button{background:#243f9a;color:white;border:0;border-radius:9px;padding:13px 20px;font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.note{color:#65718a;font-size:13px;margin-top:7px}
#status{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:18px;padding:14px;background:#f5f6fa;border-radius:8px}
.row{display:flex;gap:12px;align-items:center}.row input{width:auto}.back{color:#243f9a;text-decoration:none}
</style></head><body><main>
<a class="back" href="/">← CRM</a><h1>Instagram Direct</h1>
<p class="sub">Ручне відправлення через Render → Meta. Без автоматичних розсилок.</p>
<label for="recipient">Одержувач</label><input id="recipient" value="rolloboy_ai (3100596540128323)" readonly>
<p class="note">Поки дозволено лише перевірений тестовий контакт. Інших адресатів сервер відхиляє.</p>
<label for="message">Повідомлення</label><textarea id="message" maxlength="1000" placeholder="Введіть текст повідомлення"></textarea>
<label for="token">META_OUTBOUND_TOKEN (якщо не заданий локально)</label>
<input id="token" type="password" autocomplete="off" placeholder="Токен із Render, не зберігається">
<p class="note">Поле не зберігається на сервері чи в браузері. Не надсилайте токен у чат.</p>
<label class="row"><input id="confirm" type="checkbox"> Підтверджую відправлення одного повідомлення</label>
<button id="send" type="button">Надіслати один раз</button>
<div id="status" role="status" aria-live="polite">Готово до введення повідомлення.</div>
</main><script>
const send=document.getElementById('send'), status=document.getElementById('status');
send.addEventListener('click',async()=>{
 const text=document.getElementById('message').value.trim();
 if(!text || !document.getElementById('confirm').checked){status.textContent='Введіть текст і підтвердьте відправлення.';return;}
 if(!crypto.randomUUID){status.textContent='Потрібен сучасний браузер.';return;}
 const request_id='crmmanual_'+crypto.randomUUID().replaceAll('-','');
 const token=document.getElementById('token').value;
 send.disabled=true;status.textContent='Надсилання одного запиту...';
 try{
   const response=await fetch('/api/crm/instagram/direct/send-once',{
     method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({recipient_id:'3100596540128323',text,request_id,confirmed:true,token})
   });
   const result=await response.json();
   if(response.ok && result.status==='accepted'){
     status.textContent='Meta прийняла повідомлення. Message ID: '+(result.result?.message_id||'—')+'\nПеревірте доставку в Instagram.';
     document.getElementById('confirm').checked=false;
   } else {
     status.textContent='Відповідь сервера ('+response.status+'): '+JSON.stringify(result);
   }
 }catch(e){status.textContent='Невизначений результат мережі. Не повторюйте запит, поки не перевірите журнали Render.';}
 finally{send.disabled=false;document.getElementById('token').value='';}
});
</script></body></html>
